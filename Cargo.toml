[package]
name = "yaru"
version = "0.1.0"
edition = "2024"
description = "AUR Supply-Chain Security Layer for Arch Linux"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.33", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
sha2 = "0.10"
hex = "0.4"
colored = "3"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
base64 = "0.22"
glob = "0.3"
toml = "0.8"
anyhow = "1"
which = "7"
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
strip = true
